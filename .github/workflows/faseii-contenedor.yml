name: Fase II · Pruebas y contenedor

on:
  push:
    branches: [main]
    paths: ["FaseII/**", "Actividad5/**", "Actividad6/**", ".github/workflows/faseii-contenedor.yml"]
  pull_request:
    paths: ["FaseII/**"]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r FaseII/requirements-entrenamiento.txt -r FaseII/requirements-pruebas.txt
      - name: Entrenamiento y verificación del modelo
        env:
          MPLBACKEND: Agg
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python FaseII/modelo/entrenar_modelo.py
      - name: Pruebas de la API
        run: python -m pytest -q FaseII/tests

  contenedor:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construcción de la imagen
        run: docker build -f FaseII/Dockerfile -t voreko-ia:${{ github.sha }} .
      - name: Ejecución del contenedor
        run: |
          docker run -d --name voreko-ia -p 8000:8000 voreko-ia:${{ github.sha }}
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' voreko-ia)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' voreko-ia
      - name: Prueba de humo
        run: python3 FaseII/validacion/prueba_contenedor.py http://localhost:8000
      - name: Bitácora del contenedor
        if: always()
        run: docker logs voreko-ia
